terms:

# ───────── 기초 개념 (8) ─────────
- id: library-and-information-science
  term: 문헌정보학
  en: Library and Information Science (LIS)
  aka: [도서관학]
  category: basics
  definition: >-
    기록된 지식과 정보를 모으고, 정리하고, 보존하고, 필요한 사람에게 찾아 주는 일을 연구하는 학문입니다.
    도서관을 다루는 도서관학에서 출발해, 지금은 기록관리·정보검색·메타데이터·디지털 정보까지 넓게 다룹니다.
  related: [library, information, information-retrieval, metadata]
  sources: [iso5127]

- id: information
  term: 정보
  en: Information
  category: basics
  definition: >-
    어떤 사실이나 자료가 사람에게 의미를 갖도록 정리되어, 판단이나 행동에 쓰일 수 있게 된 것입니다.
    숫자나 기호 같은 날것의 자료(데이터)가 맥락을 얻으면 정보가 되고, 정보가 쌓여 이해로 이어지면 지식이 된다고 흔히 설명합니다.
  related: [document, library-and-information-science]
  sources: [iso5127]

- id: document
  term: 문헌
  en: Document
  aka: [도큐먼트]
  category: basics
  definition: >-
    정보가 어떤 매체에 기록되어 하나의 단위로 다룰 수 있게 된 것입니다.
    종이책만이 아니라 지도, 사진, 영상, 음원, 웹페이지, 전자 파일도 모두 문헌이 될 수 있습니다.
  related: [information, monograph, serial]
  sources: [iso5127]

- id: information-literacy
  term: 정보리터러시
  en: Information Literacy
  aka: [정보활용능력, 정보문해력]
  category: basics
  definition: >-
    정보가 필요하다는 것을 알아차리고, 그 정보를 찾아내고, 믿을 만한지 따져 보고, 올바르게 활용하는 능력입니다.
    출처를 밝히고 저작권을 지키는 태도까지 포함하며, 학교도서관과 대학도서관 교육의 중심 목표입니다.
  example: 과제 자료를 찾을 때 검색 결과의 작성자·날짜·근거를 확인하고, 쓴 자료의 출처를 적는 것.
  related: [teacher-librarian, primary-source, citation, copyright]
  sources: [ala-il, acrl-framework]

- id: five-laws-of-library-science
  term: 랑가나단의 도서관학 5법칙
  en: Ranganathan's Five Laws of Library Science
  category: basics
  definition: >-
    인도의 도서관학자 랑가나단(S. R. Ranganathan)이 1931년에 제시한 도서관 운영의 다섯 원칙입니다.
    ① 책은 이용하기 위한 것이다 ② 모든 독자에게 그의 책을 ③ 모든 책에게 그의 독자를 ④ 독자의 시간을 절약하라 ⑤ 도서관은 성장하는 유기체다.
    오늘날에도 도서관 서비스를 설계할 때 기준으로 자주 인용됩니다.
  related: [library, facet-classification]
  sources: [ranganathan]

- id: primary-source
  term: 1차 자료
  en: Primary Source
  aka: [1차 문헌, 원자료]
  category: basics
  definition: >-
    어떤 사건이나 연구를 직접 겪거나 수행한 사람이 처음 남긴 자료입니다.
    일기, 편지, 당시의 신문 기사, 사진, 실험 결과를 처음 발표한 논문, 법령 원문 등이 여기에 속합니다.
  related: [secondary-source, tertiary-source, archives]
  sources: [iso5127]

- id: secondary-source
  term: 2차 자료
  en: Secondary Source
  aka: [2차 문헌]
  category: basics
  definition: >-
    1차 자료를 바탕으로 해석하거나 분석하거나 정리한 자료입니다. 역사책, 평론, 여러 연구를 모아 검토한 논문 등이 있습니다.
    문헌정보학에서는 특히 서지·색인·초록처럼 1차 자료를 찾아가게 해 주는 자료를 2차 자료라고 부릅니다.
  related: [primary-source, tertiary-source, bibliography, index, abstract]
  sources: [iso5127]

- id: tertiary-source
  term: 3차 자료
  en: Tertiary Source
  aka: [3차 문헌]
  category: basics
  definition: >-
    1차·2차 자료를 다시 가려 뽑고 정리해, 어떤 분야를 빠르게 훑어보거나 2차 자료를 찾아가게 해 주는 자료입니다.
    백과사전, 용어사전, 연감, 편람, 「서지의 서지」 등이 해당합니다. 이 용어사전도 3차 자료입니다. 분야마다 1·2·3차를 나누는 기준이 조금씩 다릅니다.
  related: [primary-source, secondary-source, reference-material]
  sources: [iso5127]

# ───────── 도서관과 서비스 (15) ─────────
- id: library
  term: 도서관
  en: Library
  category: libraries
  definition: >-
    책을 비롯한 여러 자료를 모으고 정리하고 보존해서, 이용자가 읽고 배우고 연구할 수 있도록 제공하는 기관이나 시설입니다.
    우리나라에서는 도서관법이 도서관의 종류와 역할을 정하고 있습니다.
  related: [public-library, school-library, academic-library, special-library, national-library, librarian]
  sources: [library-act, iso5127]

- id: national-library
  term: 국가도서관
  en: National Library
  category: libraries
  definition: >-
    한 나라에서 나온 출판물을 빠짐없이 모아 영구히 보존하고, 그 나라의 서지 정보를 만드는 책임을 진 도서관입니다.
    우리나라에서는 국립중앙도서관이 이 역할을 맡고 있습니다.
  related: [legal-deposit, isbn, cip, web-archiving]
  sources: [library-act, nlk]

- id: public-library
  term: 공공도서관
  en: Public Library
  category: libraries
  definition: >-
    지역 주민 누구나 나이·직업·배경에 상관없이 이용할 수 있는 도서관입니다. 주로 국가나 지방자치단체가 세워 운영하며, 개인이나 단체가 세운 사립 공공도서관도 있습니다.
    책을 빌려주는 일뿐 아니라 독서 프로그램, 강좌, 정보 접근 지원 등 지역의 배움터 역할을 합니다.
  related: [library, small-library, lending]
  sources: [library-act, ifla-unesco-public]

- id: school-library
  term: 학교도서관
  en: School Library
  category: libraries
  definition: >-
    초·중·고등학교 안에 두어 학생과 교사의 수업, 독서, 탐구 활동을 지원하는 도서관입니다.
    학교도서관진흥법이 설치와 운영의 기준을 정하고 있습니다.
  related: [teacher-librarian, information-literacy, library]
  sources: [school-library-act, ifla-school]

- id: academic-library
  term: 대학도서관
  en: Academic Library
  aka: [대학 도서관]
  category: libraries
  definition: >-
    대학의 교육과 연구를 지원하기 위해 대학 안에 둔 도서관입니다.
    학술지, 학위논문, 학술 데이터베이스 같은 연구용 자료를 많이 갖추고 있습니다.
  related: [academic-journal, thesis, discovery-service, institutional-repository]
  sources: [university-library-act, library-act]

- id: special-library
  term: 전문도서관
  en: Special Library
  category: libraries
  definition: >-
    특정한 기관이나 분야의 필요에 맞춰 그 분야 자료를 집중적으로 모은 도서관입니다.
    연구소, 기업, 병원, 법원, 박물관 등에 딸린 도서관이 대표적입니다.
  related: [library, grey-literature]
  sources: [library-act]

- id: small-library
  term: 작은도서관
  en: Small Library
  category: libraries
  definition: >-
    아파트 단지, 주민센터, 종교시설 등 생활 가까운 곳에 작은 규모로 운영되는 공공도서관입니다.
    도서관법에서 공공도서관의 한 종류로 정하고 있으며, 주민이 직접 운영하는 곳도 많습니다.
  related: [public-library]
  sources: [library-act, small-library-act]

- id: librarian
  term: 사서
  en: Librarian
  category: libraries
  definition: >-
    도서관에서 자료를 고르고 정리하며, 이용자가 필요한 정보를 찾도록 돕는 전문직입니다.
    우리나라에서는 도서관법에 따라 1급 정사서, 2급 정사서, 준사서 자격이 있습니다.
  related: [teacher-librarian, reference-service, catalog]
  sources: [library-act]

- id: teacher-librarian
  term: 사서교사
  en: Teacher Librarian
  category: libraries
  definition: >-
    교사 자격과 사서 전문성을 함께 갖추고 학교도서관을 운영하며, 독서교육과 정보리터러시 교육을 맡는 교사입니다.
  related: [school-library, information-literacy, librarian]
  sources: [school-library-act, elementary-secondary-act, ifla-school]

- id: reference-service
  term: 참고서비스
  en: Reference Service
  aka: [참고봉사, 레퍼런스 서비스, 정보서비스]
  category: libraries
  definition: >-
    사서가 이용자의 질문을 받아 필요한 자료나 정보를 찾아 주거나, 찾는 방법을 안내하는 서비스입니다.
    도서관 안내 데스크뿐 아니라 전화, 채팅, 이메일로도 이루어집니다.
  example: "「조선시대 과거 시험에 관한 쉬운 책이 있나요?」라는 질문에 알맞은 책과 자료를 찾아 주는 것."
  related: [reference-interview, reference-material, librarian]
  sources: [iso5127]

- id: reference-interview
  term: 참고면담
  en: Reference Interview
  aka: [레퍼런스 인터뷰]
  category: libraries
  definition: >-
    이용자가 처음 꺼낸 질문 뒤에 있는 진짜 필요를 알아내기 위해 사서가 묻고 확인하는 대화입니다.
    처음 질문이 막연하거나 실제 필요와 다른 경우가 많기 때문에 참고서비스의 핵심 단계로 여겨집니다.
  related: [reference-service]
  sources: [iso5127]

- id: lending
  term: 대출
  en: Lending / Circulation
  aka: [대출반납, 열람대출]
  category: libraries
  definition: >-
    도서관 자료를 정해진 기간 동안 도서관 밖으로 빌려 가도록 하는 서비스입니다.
    대출·반납·예약·연장을 묶어 「대출 업무」라고 부르며, 요즘은 RFID를 이용한 무인 대출기도 널리 쓰입니다.
  related: [interlibrary-loan, rfid, public-library]
  sources: [iso5127]

- id: interlibrary-loan
  term: 상호대차
  en: Interlibrary Loan (ILL)
  category: libraries
  definition: >-
    내가 다니는 도서관에 없는 자료를 다른 도서관에서 빌려 와 이용할 수 있게 해 주는 도서관끼리의 협력 서비스입니다.
    국립중앙도서관의 「책바다」처럼 전국 단위로 운영하는 서비스도 있습니다.
  related: [lending, library, union-catalog]
  sources: [nlk]

- id: open-stacks
  term: 개가제
  en: Open Stacks / Open Access Shelving
  aka: [개가식]
  category: libraries
  definition: >-
    이용자가 서가에 직접 가서 책을 꺼내 보고 고를 수 있게 하는 운영 방식입니다.
    반대로 이용자가 신청하면 직원이 서고에서 꺼내다 주는 방식을 폐가제라고 하며, 귀중한 자료나 오래된 자료에 주로 씁니다.
  related: [call-number, preservation]
  sources: [iso5127]

- id: book-curation
  term: 북큐레이션
  en: Book Curation
  aka: [도서 큐레이션, 주제 전시]
  category: libraries
  definition: >-
    특정 주제나 독자, 시기에 맞춰 책을 골라 묶고 소개하는 일입니다.
    도서관의 주제별 전시, 추천 목록, 테마 서가 등이 북큐레이션의 예입니다.
  example: 수능이 끝난 뒤 「고3을 위한 쉼표 책」 코너를 만드는 것.
  related: [collection, public-library, school-library]
  sources: []

# ───────── 장서와 자료 (14) ─────────
- id: collection
  term: 장서
  en: Collection
  aka: [소장자료, 컬렉션]
  category: collections
  definition: >-
    한 도서관이 가지고 있는 자료 전체입니다.
    종이책뿐 아니라 잡지, 영상, 전자책, 구독 중인 데이터베이스까지 포함해 말하기도 합니다.
  related: [collection-development, acquisitions, weeding]
  sources: [iso5127]

- id: collection-development
  term: 장서개발
  en: Collection Development
  aka: [장서관리, 컬렉션 개발]
  category: collections
  definition: >-
    도서관이 이용자에게 필요한 자료를 계획적으로 고르고 사들이고, 평가하고, 낡은 자료를 정리하는 전체 과정입니다.
    어떤 자료를 어떤 기준으로 모을지 적어 둔 문서를 「장서개발정책」이라고 합니다.
  related: [collection, acquisitions, weeding]
  sources: [iso5127]

- id: acquisitions
  term: 수서
  en: Acquisitions
  category: collections
  definition: >-
    도서관이 자료를 들여오는 일입니다. 구입, 기증, 교환, 납본 등 여러 경로가 있습니다.
  related: [collection-development, legal-deposit]
  sources: [iso5127]

- id: legal-deposit
  term: 납본
  en: Legal Deposit
  category: collections
  definition: >-
    출판사나 발행자가 새로 낸 출판물을 법에 따라 국가도서관에 의무적으로 보내는 제도입니다.
    나라 안에서 나온 출판물을 빠짐없이 모아 후대에 남기기 위한 것이며, 우리나라에서는 도서관법에 따라 국립중앙도서관에 납본하며, 국회도서관도 별도의 법에 따라 납본을 받습니다.
  related: [national-library, acquisitions]
  sources: [library-act, nlk]

- id: weeding
  term: 제적
  en: Weeding / Deselection
  aka: [장서 솎아내기]
  category: collections
  definition: >-
    낡거나 내용이 오래되었거나 더 이상 이용되지 않는 자료를 장서에서 빼는 일입니다.
    서가를 쓸모 있게 유지하기 위한 정상적인 장서관리 과정의 일부입니다.
  related: [collection-development, collection]
  sources: [iso5127]

- id: monograph
  term: 단행본
  en: Monograph
  category: collections
  definition: >-
    한 권으로 끝나거나, 정해진 몇 권으로 완결되는 출판물입니다.
    계속 이어서 나오는 잡지·신문 같은 연속간행물과 구별할 때 쓰는 말입니다.
  related: [serial, isbn, edition]
  sources: [iso5127, isbd]

- id: serial
  term: 연속간행물
  en: Serial
  aka: []
  category: collections
  definition: >-
    끝을 정하지 않고 같은 제목으로 권호를 이어 가며 계속 나오는 출판물입니다.
    신문, 잡지, 학술지, 연감 등이 해당하며, ISSN으로 식별합니다.
  related: [academic-journal, issn, monograph]
  sources: [iso5127, issn]

- id: academic-journal
  term: 학술지
  en: Academic Journal / Scholarly Journal
  aka: [저널]
  category: collections
  definition: >-
    연구자들이 연구 결과를 논문으로 발표하는 연속간행물입니다.
    대부분 다른 전문가의 동료심사를 거친 논문을 싣습니다.
  related: [peer-review, serial, impact-factor, open-access]
  sources: [iso5127]

- id: grey-literature
  term: 회색문헌
  en: Grey Literature
  aka: [회색 문헌]
  category: collections
  definition: >-
    일반 출판사·서점 유통을 거치지 않아 구하거나 찾기 어려운 자료입니다.
    연구보고서, 정부·기관 보고서, 학술대회 발표 자료, 기술 문서, 학위논문 등이 여기에 들어갑니다.
  related: [thesis, special-library, institutional-repository]
  sources: [iso5127]

- id: reference-material
  term: 참고자료
  en: Reference Material / Reference Work
  aka: [참고도서]
  category: collections
  definition: >-
    처음부터 끝까지 읽기보다 필요한 부분을 찾아보도록 만든 자료입니다.
    사전, 백과사전, 연감, 지도책, 인명록 등이 있으며, 보통 대출하지 않고 도서관 안에서 이용합니다.
  related: [tertiary-source, reference-service]
  sources: [iso5127]

- id: thesis
  term: 학위논문
  en: Thesis / Dissertation
  category: collections
  definition: >-
    석사나 박사 학위를 받기 위해 제출하는 연구 논문입니다.
    대학도서관과 국회도서관 등이 수집하며, 상당수가 온라인으로 원문을 제공합니다.
  related: [grey-literature, academic-library, institutional-repository]
  sources: [iso5127]

- id: old-book
  term: 고서
  en: Old Book / Antiquarian Book
  aka: [고문헌, 고도서]
  category: collections
  definition: >-
    오래전에 만들어져 역사적·문화적 가치가 있는 책입니다.
    우리나라에서는 흔히 근대식 출판 이전, 대략 1910년 이전에 만들어진 책을 고서로 다룹니다. 따로 보관하고 보존 처리를 합니다.
    비슷한 말인 「귀중본(희귀본)」은 오래된 정도가 아니라 드물고 값진지를 기준으로 정하므로, 근대 이후의 책도 귀중본이 될 수 있습니다.
  related: [preservation, open-stacks, digitization]
  sources: [nlk]

- id: edition
  term: 판
  en: Edition
  aka: [판차]
  category: collections
  definition: >-
    같은 원고로 같은 모양을 갖추어 펴낸 책 전체를 묶어 부르는 단위입니다.
    내용이나 체제를 고쳐 다시 내면 「개정판」처럼 새로운 판이 되고, 내용을 그대로 두고 더 찍어 내기만 하면 판은 같고 「쇄」만 늘어납니다.
  example: 「제3판 2쇄」는 세 번째 판을 두 번째로 찍은 책이라는 뜻입니다.
  related: [monograph, isbn, wemi]
  sources: [iso5127, isbd]

- id: ebook
  term: 전자책
  en: E-book
  aka: [이북, 디지털 책]
  category: collections
  definition: >-
    종이 대신 디지털 파일로 만들어 화면으로 읽는 책입니다.
    도서관에서는 보통 사들이는 대신 이용 권한(라이선스)을 얻어 제공하므로, 동시 이용자 수나 이용 기간에 제한이 있을 수 있습니다.
  related: [digital-library, collection]
  sources: [iso5127]

# ───────── 책과 서지학 ─────────
- id: stereotype
  term: 연판
  en: Stereotype (Plate)
  aka: [스테로타이프, stereotyped plates]
  category: bibliography-books
  definition: >-
    조판한 활자 면을 본떠 금속을 부어 만든 한 장짜리 인쇄판입니다. 활자를 계속 묶어 두지 않고도 나중에 같은 면을 다시 찍을 수 있습니다.
    주잇은 1850년대에 서지 기록 한 건마다 낱장의 스테로판을 따로 떠 두었다가 도서관마다 필요한 것만 골라 짜 맞춰 목록을 찍자고 제안했습니다. 판은 값비싼 활자 합금 대신 새로 고안한 값싼 재료로 만들 계획이었습니다. 이 계획은 실현되지 못했지만, 한 번 만든 기록을 여러 도서관이 나눠 쓴다는 협동목록의 생각을 이른 시기에 체계적으로 보여 주었습니다.
  related: [cooperative-cataloging, union-catalog, book-format]
  sources: [jewett1852, foundations, gaskell]

- id: book-format
  term: 판형
  en: Format (Bibliographical)
  aka: [2절판, 4절판, 8절판, folio, quarto, octavo]
  category: bibliography-books
  definition: >-
    서지학에서 인쇄용 전지를 몇 번 접어 책을 만들었는지에 따른 책의 형태입니다.
    한 번 접어 2장(4쪽)이 되면 2절판(folio), 두 번 접어 4장이면 4절판(quarto, 4to), 세 번 접어 8장이면 8절판(octavo, 8vo)입니다. 실제 크기(cm)를 뜻하는 「크기」와는 구별해 씁니다.
  related: [signature-mark, old-book, edition]
  sources: [gaskell]

- id: signature-mark
  term: 시그니처
  en: Signature (Mark) / Register
  aka: [접장 기호, 레지스터]
  category: bibliography-books
  definition: >-
    접은 종이 묶음(접장)을 순서대로 엮도록 각 묶음의 첫 장(과 앞쪽 몇 장) 아래에 인쇄한 문자나 숫자입니다.
    시그니처 문자의 차례, 또는 그것을 적어 둔 목록을 「레지스터」라고 하며, 쪽 번호가 없는 옛 책에서는 시그니처로 위치를 가리키고 빠진 장이 없는지 확인합니다.
  related: [book-format, old-book]
  sources: [gaskell]

- id: caption-title
  term: 권두표제
  en: Caption Title / Head-title
  aka: [권두서명, 권수제]
  category: bibliography-books
  definition: >-
    본문 첫머리 위에 인쇄된 표제입니다.
    표제지가 없거나 떨어져 나간 옛 책에서는 권두표제나 간기 등을 대신 보고 표제를 정합니다. 우리 고서 목록에서는 「권수제」라고 부릅니다.
  related: [colophon, title-proper, old-book]
  sources: [gaskell, kcr]

- id: colophon
  term: 간기
  en: Colophon
  aka: [콜로폰]
  category: bibliography-books
  definition: >-
    책의 끝(또는 앞)에 언제, 어디서, 누가 찍어 냈는지를 적은 부분입니다.
    표제지가 생기기 전의 서양 초기 인쇄본과 우리 고서에서 중요한 정보원이며, 오늘날 우리 책의 「판권지(판권면)」가 같은 역할을 합니다.
  related: [caption-title, old-book, edition]
  sources: [gaskell]

- id: editio-princeps
  term: 초간본
  en: Editio Princeps
  aka: [에디티오 프린켑스, ED. PR.]
  category: bibliography-books
  definition: >-
    손으로 베껴 전해지던 작품이 처음으로 인쇄되어 나온 판입니다. 특히 그리스·로마 고전의 첫 인쇄본을 가리킬 때 많이 씁니다.
    서양어 editio princeps는 일반적인 「초판」보다 좁은 말입니다. 다만 한국어 「초간본」은 『진달래꽃』(1925) 초간본처럼 어떤 책의 첫 판을 넓게 가리키기도 합니다.
  related: [edition, old-book]
  sources: [gaskell]

# ───────── 목록과 메타데이터 (16) ─────────
- id: catalog
  term: 목록
  en: Catalog / Catalogue
  aka: [도서관 목록, 목록작업]
  category: cataloging
  definition: >-
    도서관이 가진 자료를 찾을 수 있도록 각 자료의 정보를 일정한 규칙에 따라 기록해 모아 놓은 것입니다.
    예전에는 카드 목록을 썼고 지금은 대부분 컴퓨터 목록(OPAC)을 씁니다. 자료를 보고 그 기록을 만드는 일을 「목록작업」이라고 합니다.
  related: [bibliographic-record, opac, dictionary-catalog, union-catalog, kcr, rda]
  sources: [iso5127, isbd]

- id: bibliography
  term: 서지
  en: Bibliography
  aka: [참고문헌 목록, 문헌 목록]
  category: cataloging
  definition: >-
    책이나 자료에 관한 정보(제목, 저자, 출판사, 출판연도 등)를 뜻하기도 하고, 그런 정보를 모아 놓은 목록을 뜻하기도 합니다.
    논문 끝의 「참고문헌」도 서지의 한 형태입니다.
  related: [bibliographic-record, citation, tertiary-source]
  sources: [iso5127]

- id: bibliographic-record
  term: 서지 레코드
  en: Bibliographic Record
  aka: [서지 기록]
  category: cataloging
  definition: >-
    자료 하나를 설명하는 서지 정보를 목록 규칙과 형식에 맞춰 기록한 단위입니다.
    도서관 검색에서 책 한 권을 눌렀을 때 보이는 상세 정보 화면이 서지 레코드를 보여 주는 것입니다.
  related: [catalog, marc, metadata, access-point]
  sources: [iso5127, marc21]

- id: metadata
  term: 메타데이터
  en: Metadata
  category: cataloging
  definition: >-
    어떤 자료를 설명하는 데이터, 곧 「데이터에 관한 데이터」입니다.
    책의 제목·저자, 사진의 촬영 날짜·장소, 파일의 크기·형식 등이 메타데이터이며, 자료를 찾고 관리하고 보존하는 데 쓰입니다.
  example: 스마트폰 사진 파일 안에 저장된 촬영 일시와 위치 정보.
  related: [dublin-core, bibliographic-record, marc, linked-data]
  sources: [iso5127, dublin-core]

- id: cataloging-code
  term: 목록규칙
  en: Cataloging Code / Cataloging Rules
  aka: [목록규칙집, 목록법]
  category: cataloging-rules
  definition: >-
    도서관 목록을 일관되게 만들기 위해 무엇을 어떤 형태로 기록하고 어떤 접근점을 둘지를 정해 놓은 규칙의 체계입니다.
    파니치의 91개조 규칙(1841), 커터의 사전체 목록 규칙(1876), 영미목록규칙(AACR2), RDA, 우리나라의 한국목록규칙(KCR) 등이 이어져 왔습니다.
  related: [panizzi-91-rules, kcr, rda, isbd, catalog]
  sources: [foundations, cutter1876, rda, kcr]

- id: panizzi-91-rules
  term: 파니치의 91개조 규칙
  en: Panizzi's Ninety-One Rules
  aka: [91개조 규칙, 91조 규칙, 대영박물관 목록규칙]
  category: cataloging-rules
  definition: >-
    영국 대영박물관 도서관의 앤서니 파니치(Anthony Panizzi)가 동료들과 함께 만들어 1841년 인쇄본 장서목록 첫 권 앞에 실은 91개 조의 목록 규칙입니다.
    저자명의 선택과 형태, 익명·필명 저작, 참조, 성서, 형식표목 등을 체계적으로 다루어, 이후 19~20세기 목록규칙의 출발점으로 평가받습니다.
  related: [cataloging-code, heading, cross-reference, uniform-title, catalog-slip]
  sources: [foundations, guerrini2023, lehnus1972]

- id: entry
  term: 기입
  en: Entry
  aka: [목록기입]
  category: cataloging-rules
  definition: >-
    목록에서 자료 하나를 나타내는 기록 한 건입니다. 카드 목록에서는 카드 한 장이 기입 하나였습니다.
    자료를 대표하는 완전한 기입을 「기본기입」, 다른 이름이나 표제로도 찾을 수 있게 덧붙인 기입을 「부출기입」이라고 합니다. 오늘날 컴퓨터 목록에서는 「서지 레코드」라는 말을 주로 씁니다.
  related: [heading, main-entry, added-entry, bibliographic-record]
  sources: [iso5127, foundations]

- id: heading
  term: 표목
  en: Heading
  aka: [헤딩]
  category: cataloging-rules
  definition: >-
    기입의 맨 앞에 두어 목록에서 배열하고 찾는 기준이 되는 이름, 표제, 주제명입니다.
    저자명표목, 서명표목, 주제명표목 등이 있고, 「학술단체(ACADEMIES)」나 「정기간행물(PERIODICAL PUBLICATIONS)」처럼 자료의 종류로 모으는 표목을 「형식표목」이라고 했습니다. 국제목록원칙(2009)과 RDA에서는 이 역할을 「접근점」이라고 부릅니다.
  related: [access-point, entry, main-entry, qualifier, corporate-heading, academies-heading, subject-heading]
  sources: [icp2009, foundations]

- id: academies-heading
  term: 학술단체 표목
  en: ACADEMIES (form heading)
  aka: [ACADEMIES, Academies, 아카데미 표목, 학술원 표목]
  category: cataloging-rules
  definition: >-
    파니치의 91개조 규칙(1841) 80조가 만든 형식표목으로, 학술원·연구소·협회·대학·학회의 회보, 논문집, 회의록 같은 출판물을 단체 이름이 아니라 「ACADEMIES」라는 하나의 표목 아래 모았습니다.
    그 안에서는 유럽·아시아·아프리카·아메리카의 네 대륙, 나라, 단체가 모이는 도시의 영어 이름 순으로 배열하고 맨 끝에 단체 이름을 두었습니다. 무엇을 학술단체로 볼지 가리기 어렵다는 문제는 파니치 자신도 1848년에 인정했고, 뒤의 대영박물관 목록은 대륙·나라 구분을 없애고 장소 아래로 기입하다가 결국 이 형식표목을 버렸습니다.
    영어 낱말 「Academies」는 표목이 아닐 때는 보통 학술원이라는 기관을 가리킵니다.
  related: [heading, corporate-heading, panizzi-91-rules, authorship]
  sources: [foundations, lehnus1972, fattahi-panizzi]

- id: added-entry
  term: 부출표목
  en: Added Entry
  aka: [부출기입]
  category: cataloging-rules
  definition: >-
    기본표목 말고도, 공저자·옮긴이·총서명·다른 표제 등으로도 자료를 찾을 수 있도록 덧붙이는 표목입니다.
    MARC에서는 7XX 필드(예: 700 개인명 부출표목)에, 총서명 부출은 8XX 필드에 기록합니다.
  related: [main-entry, analytical-entry, entry, heading, access-point]
  sources: [aacr2, marc21]

- id: analytical-entry
  term: 분출기입
  en: Analytical Entry / Analytic
  aka: [분석기입, 분출, analytical entries, analytics]
  category: cataloging-rules
  definition: >-
    목록에 이미 올라 있는 더 큰 자료의 한 부분, 예를 들어 논문집에 실린 논문 한 편이나 책의 한 장, 총서의 한 권을 따로 기술해 찾을 수 있게 한 기입입니다.
    전체 자료의 기록만 있으면 그 안에 든 개별 작품은 목록에서 보이지 않기 때문에, 필요한 부분을 「분출」해 따로 기입합니다. 우리 국가표준 KORMARC도 총서를 분출하는 방법을 「완전 분출 · 부분 분출 · 분출하지 않음」으로 나누어 기록합니다.
    한 글자 차이인 「부출기입(added entry)」과 헷갈리기 쉽습니다. 분출기입은 자료의 「일부」를 따로 적는 기입이고, 부출기입은 같은 자료를 「다른 이름으로도」 찾게 하는 기입입니다.
  example: "(가상의 예) 논문집 『한국 도서관의 백 년』에 실린 「일제강점기 공공도서관」이라는 논문을 따로 기입해, 그 논문 제목과 필자로도 찾을 수 있게 하는 것."
  related: [added-entry, entry, series, collective-title]
  sources: [saa-dictionary, kormarc-644, foundations]

- id: authorized-access-point
  term: 전거형 접근점
  en: Authorized Access Point
  aka: [전거형, 전거형 표목]
  category: cataloging-rules
  definition: >-
    같은 사람·단체·저작을 가리킬 때 목록에서 늘 쓰기로 정한 하나의 공식 형태입니다. 이와 달리 참조로 이어 주는 다른 형태를 「이형 접근점」이라고 합니다.
    저작의 전거형 접근점은 보통 「창작자 이름 + 저작의 우선표제」로 만들어, 예전의 기본표목과 통일표제가 하던 일을 함께 합니다.
  example: "「Tolstoy, Leo, graf, 1828-1910」을 전거형으로 정하면 「톨스토이」, 「Толстой」 같은 형태는 이형 접근점이 됩니다."
  related: [authority-control, access-point, main-entry, uniform-title, qualifier]
  sources: [rda, icp2009]

- id: cross-reference
  term: 참조
  en: Cross-reference
  aka: [상호참조, 참조표, 보라 참조, 도보라 참조, cross-references, references, see references, see also references]
  category: cataloging-rules
  definition: >-
    목록에서 한 표목으로부터 다른 표목으로 이용자를 안내하는 장치입니다.
    쓰지 않는 이름에서 쓰는 이름으로 보내는 「보라(see) 참조」와, 서로 관련 있는 표목끼리 이어 주는 「도보라(see also) 참조」가 대표적입니다.
    「상호참조」라고도 옮기지만, 영어의 cross는 「서로」가 아니라 「한 표목에서 다른 표목으로 건너가게 한다」는 뜻이라 보라 참조처럼 한 방향으로만 이어지는 참조도 포함합니다.
  example: "「춘원 → 보라: 이광수」"
  related: [authority-control, authorized-access-point, heading, pseudonym]
  sources: [aacr2, foundations]

- id: corporate-heading
  term: 단체표목
  en: Corporate Heading / Corporate Entry
  aka: [단체명표목, 단체기입, 미국식 관행, 독일식 관행, American practice, German practice]
  category: cataloging-rules
  definition: >-
    정부 기관, 학회, 회사, 회의처럼 단체가 자료에 책임을 질 때 그 단체 이름을 표목으로 삼는 것, 또는 그 표목입니다.
    단체를 저자로 볼 것인가는 오래 논쟁거리였습니다. 파니치의 91개조 규칙은 의회·관청 같은 단체의 문서를 나라나 장소 이름 아래 기입하게 하고(9조), 학술원·연구소·협회·대학·학회 같은 학술단체의 출판물은 「학술단체(ACADEMIES)」라는 형식표목 아래 단체가 있는 나라와 도시 순으로 모았습니다(80조). 단체를 저자로 보는 생각은 주잇(1852)과 커터(1876)의 규칙을 거쳐 자리 잡았습니다.
    커터는 1897년 『Library Journal』에서, 단체를 자기 학회지·회의록의 저자로 보는 「미국식 관행」이 그런 저작을 익명 저작처럼 표제의 첫 명사 아래 흩어 놓는 「독일식 관행」보다 낫다고 주장했습니다.
  related: [heading, academies-heading, authorship, authority-control]
  sources: [lehnus1972, fattahi-panizzi, jewett1852, cutter1876, foundations]

- id: pseudonym
  term: 필명
  en: Pseudonym
  aka: [가명, 펜네임]
  category: cataloging-rules
  definition: >-
    저자가 본명 대신 쓰는 이름입니다. 목록에서는 어느 이름을 표목으로 삼을지가 문제가 되는데, 오늘날 RDA는 한 사람이 쓴 서로 다른 필명을 각각 별개의 서지적 정체성으로 보고 관계로 이어 줍니다.
  example: 시인 이상(본명 김해경)의 작품은 보통 「이상」으로 찾고, 「김해경」에서는 참조로 이어 줍니다.
  related: [authorship, cross-reference, authority-control]
  sources: [rda, foundations]

- id: catalog-slip
  term: 슬립
  en: Slip
  aka: [목록 슬립]
  category: cataloging-rules
  definition: >-
    목록 기록을 한 건씩 적어 두는, 크기가 같은 종이쪽지입니다.
    한 장에 한 건씩 적으면 새 자료가 들어와도 알맞은 자리에 끼워 넣어 순서를 유지할 수 있습니다. 같은 원리가 이후 카드 목록으로 이어졌습니다.
  related: [entry, catalog, panizzi-91-rules]
  sources: [foundations]

- id: access-point
  term: 접근점
  en: Access Point
  aka: []
  category: cataloging-rules
  definition: >-
    이용자가 목록에서 자료를 찾아낼 때 실마리가 되는 이름이나 낱말입니다.
    저자명, 서명(제목), 주제명 등이 대표적인 접근점입니다. 예전에는 「표목」이라고 불렀습니다. 「접근점」이라는 말은 영미목록규칙 제2판(AACR2, 1978) 때부터 쓰였고, 국제목록원칙(2009)과 RDA에서 「표목」을 대신하는 기본 용어가 되었습니다.
  related: [heading, authorized-access-point, authority-control, main-entry, qualifier, subject-heading]
  sources: [rda, iso5127]

- id: main-entry
  term: 기본표목
  en: Main Entry / Principal Entry
  aka: [기본기입, 주된 표목]
  category: cataloging-rules
  definition: >-
    한 자료의 목록 기록을 대표하는 주된 표목으로, 보통 그 자료에 가장 큰 책임이 있는 저자를, 저자가 분명하지 않으면 표제를 택합니다.
    카드 목록 시절 한 자료를 어느 이름 아래 대표로 배열할지 정하던 개념이며, MARC에서는 1XX 필드(예: 100 개인명)가 이 자리입니다.
    우리나라 한국목록규칙 제4판(2003)은 기본표목을 정하지 않는 방식을 택했고, RDA에서는 「저작의 전거형 접근점」 개념이 그 역할을 이어받았습니다.
  related: [entry, heading, added-entry, uniform-title, authorship, kcr]
  sources: [paris-principles, aacr2, marc21, doh2010, rda]

- id: uniform-title
  term: 통일표제
  en: Uniform Title
  aka: [통일서명]
  category: cataloging-rules
  definition: >-
    같은 저작이 번역·개정·이본 등으로 서로 다른 제목을 달고 나올 때, 목록에서 그것들을 한데 모으기 위해 정해 둔 하나의 표준 제목입니다.
    MARC에서는 130·240 필드에 기록하며, RDA에서는 「저작의 우선표제」라는 개념으로 이어집니다. 성서처럼 판본과 번역이 아주 많은 경전을 「Bible」이라는 하나의 표목 아래 모으던 19세기 목록 관행(파니치의 91개조 규칙 등)이 그 뿌리로 꼽힙니다.
  example: "셰익스피어의 『햄릿』이 여러 번역 제목으로 나와도, 통일표제 「Hamlet」으로 모으면 한 번에 찾을 수 있습니다."
  related: [main-entry, authority-control, wemi, access-point]
  sources: [aacr2, marc21, rda, foundations]

- id: qualifier
  term: 한정어구
  en: Qualifier / Qualifying Phrase
  aka: [한정어, qualifying phrases, qualifiers]
  category: cataloging-rules
  definition: >-
    이름이나 표제, 주제명이 같아 서로 다른 대상을 구별하기 어려울 때, 표목(접근점) 뒤에 덧붙여 뜻을 좁혀 주는 낱말이나 구입니다.
    괄호 안에 생몰년, 직업, 장소, 분야, 회의 차수·연도 등을 넣거나, 인명에 작위·직함 같은 말을 덧붙여 구별합니다.
  example: "미국 의회도서관 주제명표목표의 「Mercury (Planet)」는 괄호 속 한정어구로 원소 수은이 아닌 행성 수성임을 나타냅니다."
  related: [heading, access-point, authority-control, subject-heading, uniform-title]
  sources: [aacr2, rda, lcsh]

- id: authority-control
  term: 전거제어
  en: Authority Control
  aka: [전거통제]
  category: cataloging-rules
  definition: >-
    같은 사람·단체·주제가 여러 이름으로 쓰여도 목록에서 하나로 모여 찾히도록 이름의 형태를 통일하고 관리하는 일입니다.
    통일한 이름과 다른 이름들의 관계를 적어 둔 기록을 「전거레코드」라고 합니다.
  example: "「이광수」와 호인 「춘원」을 같은 사람으로 묶어, 어느 이름으로 검색해도 그의 책이 모두 나오게 하는 것."
  related: [access-point, controlled-vocabulary, uniform-title, qualifier, orcid]
  sources: [ifla-lrm, rda]

- id: kcr
  term: 한국목록규칙
  en: Korean Cataloging Rules (KCR)
  aka: [KCR]
  category: cataloging-rules
  definition: >-
    우리나라 도서관이 자료의 서지 정보를 기록할 때 따르는 목록 규칙입니다.
    한국도서관협회가 만들어 왔으며, 국제 기준인 ISBD와 RDA 등의 흐름을 반영해 개정되어 왔습니다.
  related: [catalog, isbd, rda, kormarc]
  sources: [kcr]

- id: rda
  term: RDA
  en: "RDA: Resource Description and Access"
  aka: [자원의 기술과 접근]
  category: cataloging-rules
  definition: >-
    자료를 기술하고 접근점을 정하는 방법을 정한 국제 목록 규칙입니다.
    영미목록규칙(AACR2)의 뒤를 이어 2010년에 나왔으며, 개념 모형(FRBR, 뒤에는 IFLA LRM)을 바탕으로 만들어져 디지털 환경에 맞게 설계되었습니다.
  related: [ifla-lrm, kcr, catalog, access-point]
  sources: [rda]

- id: isbd
  term: ISBD
  en: International Standard Bibliographic Description
  aka: [국제표준서지기술]
  category: cataloging-rules
  definition: >-
    국제도서관연맹(IFLA)이 정한 서지 기술의 국제 표준입니다.
    어떤 정보를 어떤 순서로, 어떤 구두점(예: 제목과 저자 사이의 「 / 」)으로 구분해 적을지를 정해, 나라와 언어가 달라도 서지 정보를 알아볼 수 있게 합니다.
  related: [kcr, catalog, bibliographic-record]
  sources: [isbd]

- id: descriptive-cataloging
  term: 기술목록
  en: Descriptive Cataloging
  aka: [기술목록법]
  category: cataloging
  definition: >-
    목록작업 가운데 자료의 표제, 책임표시, 판, 발행, 형태 같은 서지적 특징을 기록하고, 저자·표제 같은 접근점을 정하는 부분입니다.
    자료가 「무엇에 관한 것인가」를 다루는 주제목록과 짝을 이룹니다.
  related: [subject-cataloging, isbd-areas, catalog, access-point]
  sources: [iso5127, foundations]

- id: subject-cataloging
  term: 주제목록
  en: Subject Cataloging
  aka: [주제분석]
  category: cataloging
  definition: >-
    목록작업 가운데 자료의 내용이 무엇에 관한 것인지 분석해 주제명을 붙이고 분류기호를 주는 부분입니다.
    자료의 겉모습과 책임 관계를 다루는 기술목록과 짝을 이룹니다.
  related: [descriptive-cataloging, subject-heading, classification]
  sources: [iso5127]

- id: isbd-areas
  term: 서지기술 영역
  en: Areas of Bibliographic Description
  aka: [기술 영역, 기술사항]
  category: cataloging
  definition: >-
    서지 정보를 적는 순서와 묶음을 정한 칸들입니다. ISBD 통합판(2011)은 0 내용형식·매체유형, 1 표제와 책임표시, 2 판, 3 자료 또는 자원유형 특성, 4 발행·제작·배포 등, 5 형태사항, 6 총서·다권단행자원, 7 주기, 8 자원식별자와 입수조건의 아홉 영역을 둡니다.
    영역을 정해 두면 어느 나라 목록이든 같은 자리에서 같은 정보를 찾을 수 있습니다.
  related: [isbd, statement-of-responsibility, title-proper, note, series, descriptive-cataloging]
  sources: [isbd]

- id: title-proper
  term: 본표제
  en: Title Proper
  aka: [본서명]
  category: cataloging
  definition: >-
    자료의 대표 이름으로 기록하는 주된 표제입니다. 다른 언어로 나란히 적힌 표제는 「대등표제」, 본표제를 보충하는 부제목은 「부표제(표제관련정보)」라고 해서 따로 기록합니다.
  example: "(가상의 예) 『바다의 시간: 남해 어촌 백 년의 기록』이라면 「바다의 시간」이 본표제, 「남해 어촌 백 년의 기록」이 부표제입니다."
  related: [statement-of-responsibility, abridgment-of-titles, collective-title, uniform-title, isbd-areas]
  sources: [isbd, kcr]

- id: abridgment-of-titles
  term: 축약표제
  en: Abridged Title / Abridgment of Titles
  aka: [표제 축약, 표제의 생략, abridgement of titles]
  category: cataloging
  definition: >-
    아주 긴 표제를 목록에 적을 때 중요하지 않은 뒷부분을 줄여 적은 표제, 또는 그렇게 줄여 적는 일입니다. 줄인 자리에는 생략부호(...)를 넣어 표시합니다.
    영미목록규칙 제2판(AACR2)은 본표제를 줄이는 것은 꼭 필요한 정보를 잃지 않을 때만 허용하고, 본표제의 처음 다섯 단어는 절대 생략하지 않도록 정했습니다.
    본문 앞 낱장에 표제만 적어 둔 면을 가리키는 「약표제(half title)」와는 다른 말입니다.
  example: "(가상의 예) 『작은 마을 도서관이 들려주는 오래된 책들과 그 책을 사랑한 사람들의 이야기』 → 「작은 마을 도서관이 들려주는 오래된 ...」"
  related: [title-proper, isbd-areas, descriptive-cataloging]
  sources: [aacr2-1b4]

- id: statement-of-responsibility
  term: 책임표시
  en: Statement of Responsibility
  aka: [책임표시사항]
  category: cataloging
  definition: >-
    자료의 내용을 만드는 데 책임이 있는 사람이나 단체(지은이, 엮은이, 옮긴이, 그린이 등)를 자료에 적힌 대로 기록한 것입니다.
    ISBD에서는 표제 뒤에 빗금(/)을 두고 적습니다.
  example: "어린 왕자 / 앙투안 드 생텍쥐페리 지음 ; 김화영 옮김"
  related: [authorship, title-proper, isbd-areas]
  sources: [isbd, kcr]

- id: annotator
  term: 주해자
  en: Annotator
  aka: [annotator, annotators]
  category: cataloging
  definition: >-
    다른 사람의 저작이나 판본에 짧은 풀이, 곧 주해(notes)를 덧붙인 사람입니다. 본문을 길게 해석하고 논의하는 「주석자(commentator)」와 짝을 이루는 말입니다.
    파니치의 91개조 규칙(1841)은 번역자·주석자·주해자의 이름에서 기본표목으로 참조를 두고(62조), 어떤 저자의 저작 전체나 상당 부분에 주석이나 주해가 붙었으면 그 저자 이름에서 주석자·주해자 이름으로도 참조를 두게 했습니다(65조).
    오늘날 MARC 역할어의 Annotator는 「인쇄본에 손으로 주석을 써넣은 사람」이라는 좁은 뜻으로 쓰입니다. 목록학에서 「주기(注記)」는 목록자가 적는 주기사항(note area)을 가리키므로, 「주기자」라고 옮기면 뜻이 헷갈릴 수 있습니다.
  related: [statement-of-responsibility, cross-reference, panizzi-91-rules, note, authorship]
  sources: [lehnus1972, foundations, lc-relators]

- id: note
  term: 주기
  en: Note
  aka: [주기사항]
  category: cataloging
  definition: >-
    정해진 다른 영역에 넣기 어려운 정보를 보충해 적는 영역입니다.
    원서명, 수록 내용, 서지 참고, 이용 제한, 소장본만의 특징 등을 자유로운 문장으로 적습니다.
  related: [isbd-areas, bibliographic-record, annotator]
  sources: [isbd]

- id: series
  term: 총서
  en: Series
  aka: [총서사항, 시리즈]
  category: cataloging
  definition: >-
    각각 제목을 가진 여러 자료를 하나의 공통 제목 아래 묶어 펴내는 것, 또는 그 공통 제목입니다.
    목록에서는 총서명과 총서 안의 번호를 따로 기록해, 같은 총서에 속한 책을 모아 찾을 수 있게 합니다.
  example: 「(세계문학전집 ; 1)」은 「세계문학전집」이라는 총서의 1번이라는 뜻입니다.
  related: [isbd-areas, serial, collective-title]
  sources: [isbd]

- id: collective-title
  term: 종합표제
  en: Collective Title
  category: cataloging
  definition: >-
    여러 개의 작품을 한 자료에 모았을 때, 그 자료 전체를 가리키는 하나의 표제입니다.
    종합표제가 없이 작품 제목만 나란히 적힌 자료는 각 작품의 표제를 차례로 기록합니다.
  example: 『김유정 단편선』은 「동백꽃」, 「봄봄」 등을 모은 자료의 종합표제입니다.
  related: [title-proper, series, uniform-title]
  sources: [isbd, kcr, foundations]

- id: authorship
  term: 저자성
  en: Authorship
  aka: [저작자성]
  category: cataloging
  definition: >-
    어떤 저작의 내용을 만들어 낸 책임이 누구에게 있는가 하는 개념입니다.
    목록에서는 저자성이 책임표시를 적고 기본표목이나 저작의 접근점을 정하는 근거가 되어, 「누구의 책인가」로 자료를 찾게 해 줍니다. 단체나 여러 사람이 함께 만든 자료에서 누구를 저자로 볼지는 목록규칙마다 다르게 정해 왔습니다.
  related: [statement-of-responsibility, main-entry, corporate-heading, pseudonym]
  sources: [foundations, rda]

- id: bibliographic-relationships
  term: 서지적 관계
  en: Bibliographic Relationships
  category: cataloging
  definition: >-
    서로 다른 자료나 저작 사이의 관계입니다. 바바라 틸렛(Barbara Tillett)은 이를 동등(같은 내용의 복제·재쇄), 파생(번역·개작), 기술(비평·해설), 전체-부분, 딸림(부록·해답집), 연속(속편·후속 간행물), 공통 특성의 일곱 가지로 정리했습니다.
    이런 관계를 기록하면 목록이 단순한 찾기 목록을 넘어, 한 저작의 여러 판과 번역과 해설서를 함께 보여 줄 수 있습니다.
  related: [wemi, ifla-lrm, uniform-title, cross-reference]
  sources: [tillett1987, ifla-lrm, foundations]

- id: dictionary-catalog
  term: 사전체목록
  en: Dictionary Catalog
  aka: [사전식 목록, dictionary catalogue]
  category: cataloging
  definition: >-
    저자명, 표제, 주제명 등 여러 종류의 기입을 한데 섞어 사전처럼 하나의 자모순으로 배열한 목록입니다.
    찰스 커터가 『사전체 목록 규칙』(1876)으로 체계화했고, 20세기 미국 도서관의 카드 목록에서 널리 쓰였습니다. 분류기호 순서로 배열하는 「분류목록」과 대비됩니다.
  related: [catalog, cutters-objects, subject-heading, cataloging-code]
  sources: [cutter1876, foundations]

- id: cutters-objects
  term: 목록의 목적(커터)
  en: Objects of the Catalog (Cutter)
  aka: [커터의 목록 목적, 목록의 목적·수단·선택의 근거, objects means reasons for choice]
  category: cataloging
  definition: >-
    찰스 커터가 『사전체 목록 규칙』에서 밝힌 목록의 세 가지 목적입니다. ① 저자·표제·주제 가운데 하나를 아는 사람이 책을 찾게 한다(찾기). ② 도서관이 어떤 저자의, 어떤 주제의, 어떤 종류의 책을 가지고 있는지 보여 준다(모으기). ③ 판과 성격을 알려 책을 고르도록 돕는다(고르기).
    커터는 이어서 목적을 이루는 「수단」과 여러 방법 가운데 하나를 고르는 「선택의 근거」를 차례로 밝혔습니다. 이 틀은 1961년 파리원칙과 오늘날 IFLA의 이용자 과업 개념으로 이어집니다.
  related: [dictionary-catalog, convenience-of-the-public, catalog, ifla-lrm]
  sources: [cutter1891, foundations, paris-principles, icp2009]

- id: convenience-of-the-public
  term: 공중의 편의
  en: Convenience of the Public
  aka: [이용자의 편의, 이용자 편의 원칙, convenience of the user]
  category: cataloging
  definition: >-
    「공중의 편의는 언제나 목록자의 편함보다 앞에 놓여야 한다」는 커터의 원칙입니다. 규칙이 아무리 논리적이어도 이용자가 실제로 찾는 방식과 어긋나면 이용자 쪽을 따라야 한다는 뜻입니다.
    IFLA 국제목록원칙(2009)도 「이용자의 편의」를 일반 원칙 가운데 가장 높은 원칙으로 둡니다.
  related: [cutters-objects, cataloging-code, access-point]
  sources: [cutter1904, foundations, icp2009]

- id: union-catalog
  term: 종합목록
  en: Union Catalog
  aka: [union catalogue]
  category: cataloging
  definition: >-
    여러 도서관의 소장 자료를 하나의 목록으로 모아, 어떤 자료가 어느 도서관에 있는지 알려 주는 목록입니다. 상호대차의 바탕이 됩니다.
    19세기 중반 주잇이 미국 여러 도서관의 자료를 한데 담은 종합목록을 구상했고, 오늘날에는 OCLC의 WorldCat이 세계 최대 규모의 종합목록입니다. 한 도서관 자체의 기본 목록을 「일반 목록(general catalogue)」이라고 부를 때와는 구별해야 합니다.
  related: [cooperative-cataloging, interlibrary-loan, catalog, stereotype]
  sources: [foundations, worldcat]

- id: cooperative-cataloging
  term: 협동목록
  en: Cooperative Cataloging
  aka: [분담목록, shared cataloging]
  category: cataloging
  definition: >-
    여러 도서관이 목록작업을 나누어 맡거나, 한 도서관이 만든 서지 레코드를 다른 도서관들이 함께 쓰는 방식입니다. 같은 책을 도서관마다 따로 목록하는 수고를 줄여 줍니다.
    주잇이 1850년대에 일찍이 체계적으로 구상했고, 미국 의회도서관의 인쇄 카드 배포(1901)와 OCLC의 온라인 공동목록(1971)을 거쳐 오늘날 도서관 목록의 기본 방식이 되었습니다.
  related: [union-catalog, bibliographic-record, marc, stereotype]
  sources: [foundations, oclc-history, lc-cards]

- id: marc
  term: MARC
  en: Machine-Readable Cataloging
  aka: [마크, MARC 21]
  category: cataloging
  definition: >-
    서지 정보를 컴퓨터가 읽고 주고받을 수 있도록 정한 데이터 형식입니다.
    1960년대 미국 의회도서관에서 개발했고, 지금은 MARC 21이 널리 쓰입니다. 정보마다 세 자리 숫자 태그를 붙이는데, 예를 들어 245는 제목을 적는 자리입니다.
  related: [kormarc, bibliographic-record, bibframe, metadata]
  sources: [marc21]

- id: kormarc
  term: KORMARC
  en: Korean MARC
  aka: [한국문헌자동화목록형식, 코마크]
  category: cataloging
  definition: >-
    MARC를 우리나라 실정에 맞게 만든 서지 데이터 형식입니다.
    국가표준(KS X 6006)으로 정해져 있으며, 국내 대부분의 도서관 목록이 이 형식으로 만들어집니다.
  related: [marc, kcr, national-library]
  sources: [kormarc, nlk]

- id: dublin-core
  term: 더블린 코어
  en: Dublin Core
  category: cataloging
  definition: >-
    웹 자원을 비롯한 다양한 자료를 간단히 설명하기 위한 메타데이터 표준입니다.
    제목, 작성자, 주제, 날짜, 형식 등 15개의 기본 요소로 이루어져 있어 도서관 밖에서도 널리 쓰입니다. 1995년 미국 오하이오주 더블린에서 열린 회의에서 이름이 붙었습니다.
  related: [metadata, oai-pmh]
  sources: [dublin-core]

- id: ifla-lrm
  term: IFLA LRM
  en: IFLA Library Reference Model
  aka: [도서관 참조 모형]
  category: cataloging
  definition: >-
    서지 정보가 무엇을 설명하는지를 개념적으로 정리한 국제도서관연맹(IFLA)의 모형입니다.
    1998년의 FRBR 등 세 개의 모형을 2017년에 하나로 통합했으며, 작품을 「저작·표현형·구현형·개별자료」의 층으로 나누어 보는 생각이 핵심입니다.
  related: [wemi, rda, bibframe]
  sources: [ifla-lrm]

- id: wemi
  term: 저작·표현형·구현형·개별자료
  en: Work, Expression, Manifestation, Item (WEMI)
  category: cataloging
  definition: >-
    하나의 작품을 네 층으로 나누어 보는 IFLA LRM의 개념입니다.
    저작은 작품 자체의 생각, 표현형은 특정 언어나 형태로 나타난 모습(예: 번역본), 구현형은 특정 출판사가 펴낸 판, 개별자료는 손에 쥐는 책 한 권입니다.
  example: "『어린 왕자』(저작) → 어느 번역가의 한국어 번역(표현형) → 그 번역의 특정 출판사 판(구현형) → 우리 학교 도서관에 꽂힌 그 책 한 권(개별자료)."
  related: [ifla-lrm, edition]
  sources: [ifla-lrm]

- id: bibframe
  term: BIBFRAME
  en: Bibliographic Framework
  aka: [빕프레임]
  category: cataloging
  definition: >-
    미국 의회도서관이 MARC를 대신하기 위해 개발해 실제로 쓰기 시작한 새로운 서지 데이터 모형입니다.
    서지 정보를 웹의 연결데이터 방식으로 표현해, 도서관 데이터가 웹의 다른 데이터와 이어지도록 하는 것이 목표입니다.
  related: [marc, linked-data, ifla-lrm]
  sources: [bibframe]

- id: linked-data
  term: 연결데이터
  en: Linked Data
  aka: [링크드 데이터, 링크드 오픈 데이터, LOD]
  category: cataloging
  definition: >-
    데이터 하나하나에 웹 주소 형태의 고유 이름(URI)을 붙이고 데이터끼리의 관계를 표준 방식으로 적어, 웹 전체에서 서로 연결되고 기계가 읽을 수 있게 하는 방식입니다.
    누구나 자유롭게 쓸 수 있게 공개한 것을 「링크드 오픈 데이터(LOD)」라고 부릅니다.
  related: [bibframe, metadata, authority-control]
  sources: [linked-data]

# ───────── 분류와 주제 (13) ─────────
- id: classification
  term: 분류
  en: Classification
  category: classification
  definition: >-
    자료를 주제나 성격이 비슷한 것끼리 모으고, 기호를 붙여 일정한 순서로 배열하는 일입니다.
    분류 덕분에 같은 주제의 책이 서가에 나란히 꽂혀 있어 둘러보며 찾을 수 있습니다.
  related: [classification-scheme, kdc, ddc, call-number]
  sources: [iso5127]

- id: classification-scheme
  term: 분류표
  en: Classification Scheme
  aka: [분류체계, 분류법]
  category: classification
  definition: >-
    지식 전체를 주제별로 나누고 각 주제에 기호를 정해 놓은 표입니다.
    한국십진분류법(KDC), 듀이십진분류법(DDC), 국제십진분류법(UDC), 미국의회도서관분류법(LCC) 등이 있습니다.
  related: [kdc, ddc, udc, facet-classification]
  sources: [iso5127]

- id: kdc
  term: 한국십진분류법
  en: Korean Decimal Classification (KDC)
  aka: [KDC]
  category: classification
  definition: >-
    한국도서관협회가 만든 우리나라의 표준 분류표로, 국내 공공도서관과 학교도서관 대부분이 씁니다.
    지식을 000 총류, 100 철학, 200 종교, 300 사회과학, 400 자연과학, 500 기술과학, 600 예술, 700 언어, 800 문학, 900 역사의 열 갈래로 나누고, 각 갈래를 다시 열로 나눕니다.
  example: 우리나라 소설은 보통 813으로 분류합니다(800 문학 → 810 한국문학 → 813 소설).
  related: [ddc, classification-scheme, call-number]
  sources: [kdc]

- id: ddc
  term: 듀이십진분류법
  en: Dewey Decimal Classification (DDC)
  aka: [DDC, 듀이]
  category: classification
  definition: >-
    미국의 멜빌 듀이가 1876년에 처음 발표한 분류표로, 세계에서 가장 널리 쓰이는 십진 분류법입니다.
    지금은 OCLC가 관리하며, 한국십진분류법도 이 구조를 본떠 만들었지만 주류의 배열은 서로 다릅니다.
  related: [kdc, udc, classification-scheme]
  sources: [ddc]

- id: udc
  term: 국제십진분류법
  en: Universal Decimal Classification (UDC)
  aka: [UDC]
  category: classification
  definition: >-
    벨기에의 오틀레와 라퐁텐이 듀이십진분류법을 바탕으로 만든 분류표입니다.
    콜론(:)이나 더하기(+) 같은 기호로 여러 주제를 조합해 복잡한 주제도 세밀하게 나타낼 수 있어, 유럽의 전문도서관 등에서 많이 씁니다.
  related: [ddc, facet-classification, classification-scheme]
  sources: [udc]

- id: facet-classification
  term: 패싯 분류
  en: Faceted Classification
  aka: [분석합성식 분류, 패싯]
  category: classification
  definition: >-
    주제를 여러 측면(패싯)으로 쪼갠 뒤, 필요한 측면들을 조합해 분류 기호를 만드는 방식입니다.
    랑가나단의 콜론분류법(1933)이 대표적이며, 온라인 쇼핑몰에서 「가격·색상·크기」로 걸러 보는 패싯 검색도 같은 생각에서 나왔습니다.
  related: [udc, five-laws-of-library-science, discovery-service]
  sources: [colon]

- id: call-number
  term: 청구기호
  en: Call Number
  category: classification
  definition: >-
    도서관에서 자료 하나하나가 서가의 어느 자리에 있는지를 알려 주는 기호입니다.
    보통 분류기호와 도서기호를 합쳐 만들고, 필요하면 별치기호(보관 장소 표시), 권차, 복본기호를 덧붙입니다. 책등에 붙은 라벨이 바로 청구기호입니다.
  example: "「813.7 김64ㅅ」 → 813.7(분류기호: 한국 소설 가운데 21세기 작품) + 김64ㅅ(도서기호: 저자와 서명)."
  related: [classification, book-number, kdc, open-stacks]
  sources: [iso5127]

- id: book-number
  term: 도서기호
  en: Book Number
  aka: [저자기호]
  category: classification
  definition: >-
    같은 분류기호를 가진 책들을 서가에서 다시 순서대로 줄 세우기 위해 붙이는 기호입니다.
    주로 저자 이름과 서명의 첫 글자로 만들며, 우리나라에서는 「리재철 한글순 도서기호법」이, 서양 책에는 「커터-샌본 저자기호표」가 많이 쓰입니다.
  related: [call-number, classification]
  sources: [lee-jaechul]

- id: subject-heading
  term: 주제명표목
  en: Subject Heading
  aka: [주제명]
  category: classification
  definition: >-
    자료의 주제를 나타내기 위해 정해진 목록에서 골라 붙이는 통제된 낱말이나 구입니다.
    같은 주제를 늘 같은 말로 표현하게 해서, 검색할 때 그 주제의 자료를 빠짐없이 모아 줍니다. 미국 의회도서관 주제명표목표(LCSH)가 대표적입니다.
  related: [controlled-vocabulary, thesaurus, access-point]
  sources: [lcsh]

- id: thesaurus
  term: 시소러스
  en: Thesaurus
  aka: [통제어휘집]
  category: classification
  definition: >-
    색인과 검색에 쓰는 낱말들을 모아 서로의 관계를 정리해 둔 어휘 사전입니다.
    대신 쓸 말(USE), 더 넓은 말(BT), 더 좁은 말(NT), 관련 있는 말(RT) 같은 관계를 표시해 검색어를 고르고 넓히는 데 도움을 줍니다.
  example: "「자동차」의 좁은 말(NT) → 「전기자동차」, 넓은 말(BT) → 「교통수단」."
  related: [controlled-vocabulary, subject-heading, index]
  sources: [iso25964]

- id: controlled-vocabulary
  term: 통제어휘
  en: Controlled Vocabulary
  aka: [통제어]
  category: classification
  definition: >-
    같은 개념을 하나의 정해진 말로만 쓰도록 미리 정해 놓은 어휘입니다.
    「핸드폰·휴대폰·휴대전화」처럼 여러 표현이 있을 때 하나로 통일해, 검색 결과가 흩어지지 않게 합니다. 반대로 정하지 않고 쓰는 일상 낱말을 「자연어」라고 합니다.
  related: [thesaurus, subject-heading, authority-control]
  sources: [iso25964]

- id: index
  term: 색인
  en: Index
  aka: [인덱스, 찾아보기]
  category: classification
  definition: >-
    자료 안의 낱말이나 주제가 어디에 있는지 찾아갈 수 있도록 정리한 목록입니다.
    책 뒤의 「찾아보기」, 여러 학술지 논문을 주제별로 찾게 해 주는 색인지, 검색엔진이 미리 만들어 두는 색인 모두 같은 원리입니다.
  related: [thesaurus, abstract, citation-index, information-retrieval]
  sources: [iso5127]

- id: abstract
  term: 초록
  en: Abstract
  aka: [요약, 개요]
  category: classification
  definition: >-
    논문이나 보고서의 내용을 짧게 요약해 앞에 붙인 글입니다.
    원문을 다 읽지 않고도 자기에게 필요한 자료인지 판단할 수 있게 해 줍니다.
  related: [index, academic-journal]
  sources: [iso5127]

# ───────── 식별자와 표준 (8) ─────────
- id: isbn
  term: 국제표준도서번호
  en: International Standard Book Number (ISBN)
  aka: [ISBN]
  category: identifiers
  definition: >-
    책마다 붙이는 세계 공통의 고유 번호입니다. 2007년부터 13자리로 쓰며, 책 뒤표지 바코드 위에서 볼 수 있습니다.
    우리나라는 국립중앙도서관 한국서지표준센터가 발급하고, 독자 대상·발행 형태·내용 분류를 나타내는 5자리 부가기호를 함께 씁니다.
  example: 978-89-…, 979-11-…로 시작하는 번호는 우리나라에서 발행된 책입니다.
  related: [issn, cip, monograph, edition]
  sources: [isbn, nlk]

- id: issn
  term: 국제표준연속간행물번호
  en: International Standard Serial Number (ISSN)
  aka: [ISSN]
  category: identifiers
  definition: >-
    잡지·학술지·신문 같은 연속간행물에 붙이는 8자리 고유 번호입니다.
    네 자리씩 하이픈으로 나누어 쓰며(예: 1234-5678), 마지막 자리는 검사용 숫자라 X가 올 수도 있습니다.
  related: [serial, isbn, academic-journal]
  sources: [issn, nlk]

- id: doi
  term: 디지털객체식별자
  en: Digital Object Identifier (DOI)
  aka: [DOI]
  category: identifiers
  definition: >-
    학술 논문 같은 디지털 자료에 붙이는 영구 식별자입니다.
    웹 주소가 바뀌어도 DOI는 그대로라서, 「https://doi.org/」 뒤에 DOI를 붙이면 자료가 옮겨 가도 계속 찾아갈 수 있습니다. 「10.」으로 시작합니다.
  related: [citation, orcid, academic-journal]
  sources: [doi]

- id: orcid
  term: ORCID
  en: Open Researcher and Contributor ID
  aka: [오알시드, 연구자 식별번호]
  category: identifiers
  definition: >-
    연구자 한 사람에게 하나씩 주는 16자리 국제 식별번호입니다(마지막 자리는 검사용이라 X가 올 수 있습니다).
    이름이 같은 연구자를 구별하고, 이름 표기가 바뀌어도 그 사람의 연구 실적을 하나로 모아 줍니다.
  related: [doi, authority-control]
  sources: [orcid]

- id: cip
  term: 출판예정도서목록
  en: Cataloging in Publication (CIP)
  aka: [CIP]
  category: identifiers
  definition: >-
    책이 나오기 전에 국가도서관이 미리 만들어 출판사에 주는 서지 정보입니다.
    책에 함께 실리거나 공유되어, 도서관들이 책을 받자마자 빠르게 목록을 만들 수 있게 돕습니다.
    미국·캐나다 등 여러 나라에서 운영하며, 우리나라에서도 국립중앙도서관이 운영했으나 2019년 ISBN 신청과 통합한 뒤 2020년 12월에 제도 운영을 중지했습니다.
  related: [isbn, catalog, national-library]
  sources: [nlk-seoji-history]

- id: rfid
  term: RFID
  en: Radio-Frequency Identification
  aka: [무선인식, 전자태그]
  category: identifiers
  definition: >-
    무선 신호로 태그의 정보를 읽어 내는 기술입니다.
    도서관에서는 책에 붙인 RFID 태그로 무인 대출·반납, 분실 방지, 장서 점검을 빠르게 합니다.
  related: [lending, collection]
  sources: [iso28560]

- id: z3950
  term: Z39.50
  en: Z39.50 Information Retrieval Protocol
  category: identifiers
  definition: >-
    서로 다른 도서관의 목록 데이터베이스를 하나의 방식으로 검색할 수 있게 해 주는 통신 규약입니다.
    도서관이 다른 기관의 서지 레코드를 검색해 가져올 때 오래전부터 써 왔습니다.
  related: [opac, bibliographic-record, oai-pmh]
  sources: [z3950]

- id: oai-pmh
  term: OAI-PMH
  en: Open Archives Initiative Protocol for Metadata Harvesting
  category: identifiers
  definition: >-
    여러 저장소(리포지터리)의 메타데이터를 한곳에서 자동으로 모아 갈 수 있게(하베스팅) 해 주는 규약입니다.
    대학의 기관 리포지터리에 올린 논문 정보를 통합 검색 서비스가 수집해 가는 데 쓰입니다. 기본 형식으로 더블린 코어를 씁니다.
  related: [institutional-repository, dublin-core, z3950]
  sources: [oai-pmh]

# ───────── 정보검색 (8) ─────────
- id: information-retrieval
  term: 정보검색
  en: Information Retrieval (IR)
  category: retrieval
  definition: >-
    많은 자료 가운데서 이용자의 필요에 맞는 정보를 찾아내는 일, 또는 그것을 가능하게 하는 시스템과 기술을 연구하는 분야입니다.
    도서관 목록 검색부터 인터넷 검색엔진까지 모두 정보검색의 예입니다.
  related: [boolean-search, recall, precision, opac, index]
  sources: [iir]

- id: opac
  term: OPAC
  en: Online Public Access Catalog
  aka: [온라인 열람목록, 소장자료 검색]
  category: retrieval
  definition: >-
    이용자가 컴퓨터나 스마트폰으로 도서관 소장 자료를 검색할 수 있게 공개한 온라인 목록입니다.
    책이 있는지, 어디에 꽂혀 있는지(청구기호), 지금 빌릴 수 있는지를 확인할 수 있습니다.
  related: [catalog, discovery-service, call-number]
  sources: [iso5127]

- id: discovery-service
  term: 디스커버리 서비스
  en: Discovery Service
  aka: [통합검색, 웹 스케일 디스커버리]
  category: retrieval
  definition: >-
    도서관이 가진 책과 구독 중인 전자저널·데이터베이스·논문을 한 번의 검색으로 함께 찾아 주는 통합 검색 서비스입니다.
    대학도서관 홈페이지의 검색창이 대부분 이 방식입니다.
  related: [opac, academic-library, facet-classification]
  sources: []

- id: boolean-search
  term: 불리언 검색
  en: Boolean Search
  aka: [논리연산 검색, 불 검색]
  category: retrieval
  definition: >-
    AND(그리고), OR(또는), NOT(빼기) 같은 논리 연산자로 검색어를 조합해 결과를 좁히거나 넓히는 검색 방법입니다.
  example: "「기후변화 AND 청소년」은 두 낱말이 모두 들어간 자료, 「영화 OR 드라마」는 둘 중 하나라도 들어간 자료를 찾습니다."
  related: [truncation, information-retrieval]
  sources: [iir]

- id: truncation
  term: 절단검색
  en: Truncation
  aka: [절단 검색, 와일드카드 검색]
  category: retrieval
  definition: >-
    낱말의 일부만 입력하고 나머지를 기호(* 등)로 비워 두어, 그 부분으로 시작하거나 끝나는 낱말을 한꺼번에 찾는 방법입니다.
  example: "「librar*」로 검색하면 library, libraries, librarian이 모두 찾아집니다."
  related: [boolean-search, information-retrieval]
  sources: [iir]

- id: recall
  term: 재현율
  en: Recall
  aka: [검색률]
  category: retrieval
  definition: >-
    찾아야 할 적합한 자료 전체 가운데 실제로 검색되어 나온 비율입니다.
    재현율이 높으면 빠뜨린 자료가 적다는 뜻입니다. 계산식은 「검색된 적합 자료 수 ÷ 전체 적합 자료 수」입니다.
  related: [precision, information-retrieval]
  sources: [iir]

- id: precision
  term: 정확률
  en: Precision
  aka: [정도율]
  category: retrieval
  definition: >-
    검색되어 나온 자료 가운데 실제로 적합한 자료의 비율입니다.
    정확률이 높으면 쓸데없는 결과가 적다는 뜻입니다. 계산식은 「검색된 적합 자료 수 ÷ 검색된 전체 자료 수」입니다.
    보통 재현율을 높이면 정확률이 떨어지고, 정확률을 높이면 재현율이 떨어지는 경향이 있습니다.
  related: [recall, information-retrieval]
  sources: [iir]

- id: citation-index
  term: 인용색인
  en: Citation Index
  category: retrieval
  definition: >-
    어떤 논문이 어떤 논문을 인용했는지를 기록해, 인용 관계를 따라가며 자료를 찾을 수 있게 만든 색인입니다.
    유진 가필드가 과학 분야의 인용색인을 처음 제안했고, 우리나라에는 한국연구재단의 한국학술지인용색인(KCI)이 있습니다.
  related: [citation, impact-factor, bibliometrics, index]
  sources: [garfield, kci]

# ───────── 학술정보와 저작권 (12) ─────────
- id: peer-review
  term: 동료심사
  en: Peer Review
  aka: [동료평가, 피어 리뷰]
  category: scholarly
  definition: >-
    논문을 학술지에 싣기 전에 같은 분야의 다른 전문가들이 내용을 검토해 실을지 말지를 판단하는 과정입니다.
    연구의 질을 지키는 장치로, 심사자와 저자가 서로 누구인지 모르게 하는 경우가 많습니다.
  related: [academic-journal, open-access]
  sources: [iso5127]

- id: open-access
  term: 오픈액세스
  en: Open Access (OA)
  aka: [OA, 오픈 액세스, 개방형 접근]
  category: scholarly
  definition: >-
    학술 논문 등 연구 결과를 누구나 인터넷에서 비용 없이 읽고 내려받을 수 있게 공개하는 것입니다.
    2002년 부다페스트 오픈액세스 선언(BOAI)으로 널리 알려졌습니다. 학술지에서 바로 공개하는 방식(골드 OA)과 저자가 리포지터리에 따로 올리는 방식(그린 OA)이 있습니다.
  related: [institutional-repository, creative-commons, academic-journal]
  sources: [boai]

- id: institutional-repository
  term: 기관 리포지터리
  en: Institutional Repository (IR)
  aka: [기관 저장소, 리포지터리]
  category: scholarly
  definition: >-
    대학이나 연구기관이 소속 구성원의 논문, 보고서, 데이터 같은 연구 결과를 모아 보존하고 온라인으로 공개하는 저장소입니다.
  related: [open-access, oai-pmh, thesis, grey-literature]
  sources: [oai-pmh, boai]

- id: citation
  term: 인용
  en: Citation
  category: scholarly
  definition: >-
    글을 쓸 때 다른 사람의 글이나 생각을 가져다 쓰고 그 출처를 밝히는 것입니다.
    출처를 밝혀야 읽는 사람이 원래 자료를 확인할 수 있고, 원저작자의 노력을 인정할 수 있습니다. 출처를 밝히지 않고 가져다 쓰면 표절이 됩니다.
  related: [bibliography, citation-index, copyright, doi]
  sources: [iso5127]

- id: bibliometrics
  term: 계량서지학
  en: Bibliometrics
  aka: [서지계량학]
  category: scholarly
  definition: >-
    논문 수, 인용 횟수, 저자·학술지 분포 같은 서지 데이터를 숫자로 세고 분석해 학술 활동의 경향을 밝히는 연구 분야입니다.
  related: [impact-factor, h-index, bradfords-law, citation-index]
  sources: [bradford, garfield]

- id: impact-factor
  term: 영향력지수
  en: Journal Impact Factor (JIF)
  aka: [임팩트 팩터, IF]
  category: scholarly
  definition: >-
    학술지에 실린 논문이 평균적으로 얼마나 자주 인용되는지를 나타내는 지표입니다.
    한 해에 그 학술지의 지난 2년 치 논문이 받은 인용 수를, 그 2년 동안 실린 인용 가능한 논문(연구 논문·리뷰) 수로 나누어 계산합니다. 학술지의 지표이지 논문 한 편이나 연구자 개인의 수준을 보여 주는 지표는 아니라는 점에 주의해야 합니다.
  related: [h-index, citation-index, bibliometrics]
  sources: [garfield]

- id: h-index
  term: h지수
  en: h-index
  aka: [H-지수, 허시 지수]
  category: scholarly
  definition: >-
    연구자의 논문 수와 인용 수를 함께 반영한 지표로, 물리학자 허시가 2005년에 제안했습니다.
    「h편의 논문이 각각 h번 이상 인용되었을 때」 그 연구자의 h지수는 h입니다.
  example: 10번 이상 인용된 논문이 10편 있고, 11번 이상 인용된 논문은 11편이 안 되면 h지수는 10입니다.
  related: [impact-factor, bibliometrics]
  sources: [hirsch]

- id: bradfords-law
  term: 브래드포드 법칙
  en: Bradford's Law
  category: scholarly
  definition: >-
    한 주제의 논문은 소수의 핵심 학술지에 몰려 있고, 나머지는 많은 학술지에 조금씩 흩어져 있다는 법칙입니다.
    영국의 브래드포드가 1934년에 밝혔으며, 도서관이 어떤 학술지를 우선 구독할지 정하는 데 참고합니다.
  related: [bibliometrics, collection-development, academic-journal]
  sources: [bradford]

- id: copyright
  term: 저작권
  en: Copyright
  category: scholarly
  definition: >-
    글, 그림, 음악, 영상, 프로그램 같은 창작물을 만든 사람에게 법이 주는 권리입니다.
    복제·공연·공중송신·배포 등을 허락하거나 막을 수 있는 권리가 있으며, 우리나라에서는 원칙적으로 저작자가 살아 있는 동안과 사망 후 70년까지 보호됩니다.
  related: [fair-use, creative-commons, public-domain, citation]
  sources: [copyright-act]

- id: fair-use
  term: 공정이용
  en: Fair Use
  aka: [공정한 이용]
  category: scholarly
  definition: >-
    저작권자의 허락을 받지 않아도, 정당한 목적으로 저작물을 쓸 수 있도록 법이 허용하는 범위입니다.
    이용 목적, 저작물의 성격, 이용한 양, 원작 시장에 미치는 영향 등을 따져 판단합니다. 우리 저작권법에도 2011년 개정으로 「저작물의 공정한 이용」 조항(현재 제35조의5)이 생겨 2012년부터 시행되고 있습니다.
  related: [copyright, citation, public-domain]
  sources: [copyright-act]

- id: creative-commons
  term: 크리에이티브 커먼즈 라이선스
  en: Creative Commons License (CCL)
  aka: [CCL, CC 라이선스]
  category: scholarly
  definition: >-
    저작자가 미리 정한 조건만 지키면 누구나 허락을 따로 받지 않고 저작물을 쓸 수 있게 하는 공개 이용 허락 표시입니다.
    저작자표시(BY), 비영리(NC), 변경금지(ND), 동일조건변경허락(SA)을 조합해 조건을 정합니다. 이 용어사전은 CC BY 4.0으로 공개합니다.
  related: [copyright, open-access, public-domain]
  sources: [creative-commons]

- id: public-domain
  term: 퍼블릭 도메인
  en: Public Domain
  aka: [자유이용 저작물, 만료 저작물]
  category: scholarly
  definition: >-
    저작권 보호 기간이 끝났거나 저작권자가 재산적 권리(저작재산권)를 포기해, 누구나 자유롭게 쓸 수 있는 상태의 저작물입니다.
  related: [copyright, creative-commons, digitization]
  sources: [copyright-act, creative-commons]

# ───────── 디지털과 보존 (6) ─────────
- id: digital-library
  term: 디지털도서관
  en: Digital Library
  aka: [전자도서관]
  category: digital
  definition: >-
    디지털 형태의 자료를 모아 정리하고, 인터넷으로 언제 어디서나 이용할 수 있게 제공하는 도서관 또는 서비스입니다.
  related: [digitization, ebook, digital-preservation]
  sources: [iso5127]

- id: digitization
  term: 디지털화
  en: Digitization
  aka: [디지털 변환]
  category: digital
  definition: >-
    종이책, 사진, 필름, 음반 같은 아날로그 자료를 스캔하거나 촬영해 디지털 파일로 바꾸는 일입니다.
    원본을 덜 만지게 해 보존에 도움이 되고, 멀리 있는 사람도 볼 수 있게 해 줍니다.
  related: [digital-library, old-book, preservation, digital-preservation]
  sources: [iso5127]

- id: digital-preservation
  term: 디지털 보존
  en: Digital Preservation
  category: digital
  definition: >-
    디지털 자료를 오랜 세월이 지나도 읽고 쓸 수 있도록 지키는 일입니다.
    파일 형식이나 프로그램이 낡아 못 쓰게 되는 문제를 막기 위해 형식 변환, 여러 곳 복사, 파일 손상 검사 등을 합니다. 국제 표준 모형으로 OAIS(ISO 14721)가 있습니다.
  related: [preservation, web-archiving, digitization, metadata]
  sources: [oais]

- id: web-archiving
  term: 웹 아카이빙
  en: Web Archiving
  category: digital
  definition: >-
    사라지거나 바뀌기 쉬운 웹사이트를 일정한 때마다 수집해 그 모습을 그대로 보존하는 일입니다.
    국가도서관들이 주로 맡으며, 우리나라에서는 국립중앙도서관이 「OASIS」라는 이름으로 운영합니다.
  related: [digital-preservation, national-library]
  sources: [iipc, nlk]

- id: archives
  term: 아카이브
  en: Archives
  aka: [기록관, 기록보존소]
  category: digital
  definition: >-
    개인이나 기관이 활동하며 남긴 기록 가운데 오래 남길 가치가 있는 것을 보존하고 이용하게 하는 곳, 또는 그 기록 묶음 자체를 말합니다.
    도서관이 출판된 자료를 모은다면, 아카이브는 업무 과정에서 생긴 하나뿐인 기록을 출처별로 모은다는 점이 다릅니다.
  related: [primary-source, preservation, digital-preservation]
  sources: [ica]

- id: preservation
  term: 보존
  en: Preservation
  aka: [자료보존, 보존관리]
  category: digital
  definition: >-
    자료가 손상되지 않고 오래 이용될 수 있도록 보호하는 모든 활동입니다.
    알맞은 온도·습도 유지, 빛과 해충 차단, 산성 종이를 중화하는 탈산 처리, 찢어진 곳 수선, 디지털화 등이 포함됩니다.
  related: [digital-preservation, old-book, digitization, archives]
  sources: [iso5127]

# ───────── 기관과 단체 ─────────
- id: ala
  term: 미국도서관협회
  en: American Library Association (ALA)
  aka: [ALA]
  category: organizations
  definition: >-
    미국의 도서관과 사서들이 모인 협회로, 1876년 필라델피아에서 창립되었으며 세계에서 가장 오래되고 큰 도서관 협회로 꼽힙니다. 본부는 시카고에 있습니다.
    창립에는 멜빌 듀이, 찰스 커터 등이 참여했습니다. 도서관 이용자의 알 권리와 지적 자유를 밝힌 「도서관 권리장전(Library Bill of Rights, 1939)」을 채택했고, 미국·캐나다 문헌정보학 대학원 과정을 인증하며, 어린이책 상인 뉴베리상과 칼데콧상을 수여합니다.
  related: [ddc, information-literacy, library, librarian]
  sources: [ala]

